                const content = await zip.generateAsync({ type: "blob" });
                downloadBlob(content, `${fileName}_Neon_Export.zip`, "application/zip");
            };
            
            // Main App Component
            const BinTVApp = () => {
                const [viewMode, setViewMode] = useState('hex'); // Options: 'hex', 'svg'
                const [liveSvg, setLiveSvg] = useState(null);
                const [fileData, setFileData] = useState(null);
                const [originalFileData, setOriginalFileData] = useState(null);
                const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
                const [fileName, setFileName] = useState('');
                const [structDef, setStructDef] = useState(`# Define your Construct structure here
# Example:
format_struct = Struct(
    "magic" / Bytes(4),
    "version" / Int16ul,
    "size" / Int32ul,
    "data" / Bytes(8),
    "checksum" / Int32ul,
)`);
                const [parsedFields, setParsedFields] = useState([]);
                const [selectedField, setSelectedField] = useState(null);
                const [hoveredField, setHoveredField] = useState(null);
                const [highlightRanges, setHighlightRanges] = useState([]);
                const [isLoading, setIsLoading] = useState(true);
                const [isParsing, setIsParsing] = useState(false);
                const [error, setError] = useState(null);
                const [parseStatus, setParseStatus] = useState('');
                const [editingField, setEditingField] = useState(null);
                
                // Build mode state
                const [isBuildMode, setIsBuildMode] = useState(false);
                const [buildValues, setBuildValues] = useState({});
                
                // PCAP-specific state
                const [isPcapFile, setIsPcapFile] = useState(false);
                const [pcapPackets, setPcapPackets] = useState([]);
                const [currentPacketIndex, setCurrentPacketIndex] = useState(0);
                const [originalPcapData, setOriginalPcapData] = useState(null);

                // Image preview state
                const [imageMimeType, setImageMimeType] = useState(null);
                const [showImagePreview, setShowImagePreview] = useState(false);
                const [imageUrl, setImageUrl] = useState(null);
                const [imageError, setImageError] = useState(false);

                const fileInputRef = useRef(null);
                const parseTimeoutRef = useRef(null);
                const parseInput = useRef(null);
                if (parseInput.current?.data !== fileData || parseInput.current?.code !== structDef || parseInput.current?.build !== isBuildMode) {
                    parseInput.current = { data: fileData, code: structDef, build: isBuildMode };
                }
                
                // --- EFFECTS ---
                
                // 1. Live SVG Generation
                useEffect(() => {
                    if (viewMode !== 'svg' || !fileData || parsedFields.length === 0) {
                        setLiveSvg(null);
                        return;
                    }
                    
                    const timer = setTimeout(() => {
                        const svg = generateNeonSVG(fileData, parsedFields, fileName || "Untitled", "Live Preview");
                        setLiveSvg(svg);
                    }, 1000);
                    
                    return () => clearTimeout(timer);
                }, [fileData, parsedFields, fileName, viewMode]);
                
                // 2. Initialize Pyodide
                useEffect(() => {
                    initPyodide().then(() => {
                        setIsLoading(false);
                        setParseStatus('>>> Python environment ready');
                        const urlParams = new URLSearchParams(window.location.search);
                        const template = urlParams.get('template');
                        if (template && CONSTRUCT_LIBRARY[template]) {
                            setStructDef(CONSTRUCT_LIBRARY[template].code);
                            setParseStatus(`>>> Loaded template: ${CONSTRUCT_LIBRARY[template].name}`);
                        }
                    }).catch(err => {
                        setError('Failed to initialize Pyodide: ' + err.message);
                        setIsLoading(false);
                    });
                }, []);
                
                // 3. Reactive parsing with debounce
                useEffect(() => {
                    if (!fileData || !pyodideReady || isBuildMode) return;
                    
                    const hasRealContent = structDef.split('\n').some(line => {
                        const trimmed = line.trim();
                        return trimmed && !trimmed.startsWith('#');
                    });
                    
                    if (!hasRealContent) return;
                    
                    if (isPcapFile) {
                        handleParse();
                        return;
                    }
                    
                    if (parseTimeoutRef.current) clearTimeout(parseTimeoutRef.current);
                    
                    parseTimeoutRef.current = setTimeout(() => {
                        handleParse();
                    }, 500);
                    
                    return () => {
                        if (parseTimeoutRef.current) clearTimeout(parseTimeoutRef.current);
                    };
                }, [structDef, fileData, pyodideReady, isPcapFile, isBuildMode]);
                
                // --- HANDLERS ---
                
                const handleFileUpload = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    setFileName(file.name);
                    setParseStatus(`>>> Loading file: ${file.name}`);
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        const arrayBuffer = e.target.result;
                        const uint8Array = new Uint8Array(arrayBuffer);
                        
                        let isPcap = false;
                        if (uint8Array.length >= 4) {
                            const view = new DataView(uint8Array.buffer, uint8Array.byteOffset, uint8Array.byteLength);
                            const magic = view.getUint32(0, true);
                            const magicBE = view.getUint32(0, false);
                            isPcap = (magic === 0xa1b2c3d4 || magicBE === 0xd4c3b2a1 || magic === 0x0A0D0D0A);
                            if (!isPcap) {
                                const fName = file.name.toLowerCase();
                                isPcap = fName.endsWith('.pcap') || fName.endsWith('.pcapng');
                            }
                        }
                        
                        if (isPcap) {
                            try {
                                const packets = parsePcap(uint8Array);
                                setIsPcapFile(true);
                                setPcapPackets(packets);
                                setOriginalPcapData(uint8Array);
                                setCurrentPacketIndex(0);
                                setImageMimeType(null);
                                setShowImagePreview(false);
                                if (packets.length > 0) {
                                    setFileData(packets[0].data);
                                    setOriginalFileData(new Uint8Array(packets[0].data));
                                    setParseStatus(`>>> PCAP loaded: ${packets.length} packets, showing packet 0`);
                                } else {
                                    setParseStatus(`>>> PCAP loaded but contains no packets`);
                                }
                            } catch (err) {
                                console.error('PCAP parsing error:', err);
                                setParseStatus(`>>> PCAP parse error: ${err.message}`);
                                setIsPcapFile(false);
                                setFileData(uint8Array);
                                setOriginalFileData(new Uint8Array(uint8Array));
                            }
                        } else {
                            setIsPcapFile(false);
                            setPcapPackets([]);
                            setFileData(uint8Array);
                            setOriginalFileData(new Uint8Array(uint8Array));
                            setHasUnsavedChanges(false);
                            // Image detection: if the file looks like a renderable image,
                            // open the preview sidebar automatically.
                            const mime = detectImageMime(uint8Array, file.name);
                            setImageMimeType(mime);
                            setShowImagePreview(!!mime);
                            if (mime) {
                                setParseStatus(`>>> Image loaded (${mime}): ${uint8Array.length} bytes`);
                            } else {
                                setParseStatus(`>>> File loaded: ${uint8Array.length} bytes`);
                            }
                        }
                    };
                    reader.readAsArrayBuffer(file);
                };
                
                const parsePcap = (data) => {
                    const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
                    const packets = [];
                    const magic = view.getUint32(0, true);
                    const magicBE = view.getUint32(0, false);
                    
                    if (magic === 0x0A0D0D0A) return parsePcapNG(data, view);
                    
                    const isLittleEndian = magic === 0xa1b2c3d4;
                    if (!isLittleEndian && magicBE !== 0xd4c3b2a1) throw new Error('Invalid PCAP');
                    
                    let offset = 24;
                    let packetNum = 0;
                    while (offset + 16 <= data.length) {
                        const incl_len = view.getUint32(offset + 8, isLittleEndian);
                        const orig_len = view.getUint32(offset + 12, isLittleEndian);
                        offset += 16;
                        if (offset + incl_len > data.length) break;
                        const packetData = new Uint8Array(data.buffer, data.byteOffset + offset, incl_len);
                        packets.push({ index: packetNum, capturedLength: incl_len, originalLength: orig_len, data: packetData });
                        offset += incl_len;
                        packetNum++;
                    }
                    return packets;
                };
                
                const parsePcapNG = (data, view) => {
                    const packets = [];
                    let offset = 0;
                    let packetNum = 0;
                    while (offset + 12 <= data.length) {
                        const blockType = view.getUint32(offset, true);
                        const blockLen = view.getUint32(offset + 4, true);
                        if (blockLen < 12 || offset + blockLen > data.length) break;
                        
                        if (blockType === 0x00000006) {
                            const capturedLen = view.getUint32(offset + 20, true);
                            const dataOffset = offset + 28;
                            if (dataOffset + capturedLen <= offset + blockLen) {
                                const packetData = new Uint8Array(data.buffer, data.byteOffset + dataOffset, capturedLen);
                                packets.push({ index: packetNum, capturedLength: capturedLen, data: packetData });
                                packetNum++;
                            }
                        } else if (blockType === 0x00000003) {
                            const originalLen = view.getUint32(offset + 8, true);
                            const capturedLen = Math.min(originalLen, blockLen - 16);
                            const dataOffset = offset + 12;
                            if (dataOffset + capturedLen <= offset + blockLen) {
                                const packetData = new Uint8Array(data.buffer, data.byteOffset + dataOffset, capturedLen);
                                packets.push({ index: packetNum, capturedLength: capturedLen, data: packetData });
                                packetNum++;
                            }
                        }
                        offset += blockLen;
                    }
                    return packets;
                };
                
                const handlePacketChange = (newIndex) => {
                    if (!isPcapFile || newIndex < 0 || newIndex >= pcapPackets.length) return;
                    const packet = pcapPackets[newIndex];
                    setCurrentPacketIndex(newIndex);
                    setFileData(packet.data);
                    setOriginalFileData(new Uint8Array(packet.data));
                    setHasUnsavedChanges(false);
                    setParseStatus(`>>> Showing packet ${newIndex} of ${pcapPackets.length - 1} (${packet.data.length} bytes)`);
                };

                // Detect image MIME type from magic bytes (with extension fallback).
                // Returns null when the bytes don't look like a renderable image.
                const detectImageMime = (bytes, name) => {
                    if (!bytes || bytes.length < 4) return null;
                    // PNG: 89 50 4E 47 0D 0A 1A 0A
                    if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) return 'image/png';
                    // JPEG: FF D8 FF
                    if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) return 'image/jpeg';
                    // GIF: 'GIF8'
                    if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x38) return 'image/gif';
                    // BMP: 'BM'
                    if (bytes[0] === 0x42 && bytes[1] === 0x4D) return 'image/bmp';
                    // WebP: 'RIFF' .... 'WEBP'
                    if (bytes.length >= 12 &&
                        bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
                        bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50) return 'image/webp';
                    // ICO: 00 00 01 00
                    if (bytes[0] === 0x00 && bytes[1] === 0x00 && bytes[2] === 0x01 && bytes[3] === 0x00) return 'image/x-icon';
                    // SVG / XML — peek first 256 bytes for '<svg' or '<?xml ... <svg'
                    try {
                        const head = new TextDecoder('utf-8', { fatal: false })
                            .decode(bytes.slice(0, Math.min(256, bytes.length)))
                            .toLowerCase();
                        if (head.includes('<svg')) return 'image/svg+xml';
                    } catch (_) {}
                    // Extension fallback for ambiguous formats
                    if (name) {
                        const lower = name.toLowerCase();
                        if (lower.endsWith('.png')) return 'image/png';
                        if (lower.endsWith('.jpg') || lower.endsWith('.jpeg')) return 'image/jpeg';
                        if (lower.endsWith('.gif')) return 'image/gif';
                        if (lower.endsWith('.bmp')) return 'image/bmp';
                        if (lower.endsWith('.webp')) return 'image/webp';
                        if (lower.endsWith('.svg')) return 'image/svg+xml';
                        if (lower.endsWith('.ico')) return 'image/x-icon';
                    }
                    return null;
                };

                // Maintain an object URL for the current fileData when it's a renderable
                // image. The URL is regenerated whenever fileData changes so edits are
                // reflected live. Old URLs are revoked to avoid memory leaks.
                useEffect(() => {
                    if (!fileData || !imageMimeType) {
                        setImageUrl(prev => {
                            if (prev) URL.revokeObjectURL(prev);
                            return null;
                        });
                        setImageError(false);
                        return;
                    }
                    const blob = new Blob([fileData], { type: imageMimeType });
                    const url = URL.createObjectURL(blob);
                    setImageError(false);
                    setImageUrl(prev => {
                        if (prev) URL.revokeObjectURL(prev);
                        return url;
                    });
                    return () => URL.revokeObjectURL(url);
                }, [fileData, imageMimeType]);

                // PCAP keyboard navigation: n=next, p=prev, g=first, G=last
                useEffect(() => {
                    if (!isPcapFile) return;
                    const onKey = (e) => {
                        const t = e.target;
                        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
                        if (e.ctrlKey || e.altKey || e.metaKey) return;
                        if (e.key === 'n') {
                            e.preventDefault();
                            handlePacketChange(currentPacketIndex + 1);
                        } else if (e.key === 'p') {
                            e.preventDefault();
                            handlePacketChange(currentPacketIndex - 1);
                        } else if (e.key === 'g') {
                            e.preventDefault();
                            handlePacketChange(0);
                        } else if (e.key === 'G') {
                            e.preventDefault();
                            handlePacketChange(pcapPackets.length - 1);
                        }
                    };
                    document.addEventListener('keydown', onKey);
                    return () => document.removeEventListener('keydown', onKey);
                }, [isPcapFile, currentPacketIndex, pcapPackets]);
                
                const flattenFields = (fields, list = []) => {
                    fields.forEach((field, topLevelIndex) => {
                        list.push({ offset: field.offset, length: field.length, topLevelIndex: topLevelIndex, name: field.name, value: field.value });
                        if (field.children) flattenFieldsNested(field.children, list, topLevelIndex, field.name);
                    });
                    return list;
                };
                
                const flattenFieldsNested = (fields, list, topLevelIndex, parentName) => {
                    fields.forEach(field => {
                        list.push({ offset: field.offset, length: field.length, topLevelIndex: topLevelIndex, name: parentName + '.' + field.name, value: field.value });
                        if (field.children) flattenFieldsNested(field.children, list, topLevelIndex, parentName + '.' + field.name);
                    });
                };
                
                const handleParse = async (isAuto = false) => {
                    if (!fileData || !pyodideReady) return;
                    if (!isAuto) setError(null);
                    if (!isAuto) setParseStatus('>>> Parsing structure...');
                    setIsParsing(true);
                    const input = parseInput.current;
                    try {
                        const fields = await parseWithConstruct(fileData, structDef);
                        if (input !== parseInput.current) return;
                        setSelectedField(null);
                        setHoveredField(null);
                        setParsedFields(fields);
                        setHighlightRanges(flattenFields(fields));
                        setParseStatus(`>>> Parse complete: ${fields.length} fields`);
                        setError(null);
                    } catch (err) {
                        if (input !== parseInput.current) return;
                        console.warn('Parse failed:', err.message);
                        if (!isAuto) {
                            setError(err.message);
                            setParsedFields([]);
                            setHighlightRanges([]);
                            setParseStatus('>>> Parse error');
                        }
                    } finally {
                        if (input === parseInput.current) setIsParsing(false);
                    }
                };
                
                const handleFieldSelect = useCallback((field) => { setSelectedField(field); }, []);
                const handleFieldHover = useCallback((field) => { setHoveredField(field); }, []);
                const handleFieldEdit = useCallback((field) => { setEditingField({ ...field, editHex: Array.from(fileData.subarray(field.offset, field.offset + field.length), formatHex).join('') }); }, [fileData]);
                
                // Menu Export Hook
                useEffect(() => {
                    window.onExportField = (field, format) => {
                        if (!fileData || !field || field.length === 0) return;
                        const fieldBytes = fileData.slice(field.offset, field.offset + field.length);
                        if (format === 'python') {
                            const hexBytes = Array.from(fieldBytes).map(b => '\\x' + b.toString(16).padStart(2, '0')).join('');
                            navigator.clipboard.writeText(`b"${hexBytes}"`).then(() => setParseStatus(`>>> Copied ${field.name} bytes`));
                        } else if (format === 'file') {
                            const blob = new Blob([fieldBytes], { type: 'application/octet-stream' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `${fileName}_${field.name}.bin`;
                            a.click();
                            URL.revokeObjectURL(url);
                            setParseStatus(`>>> Exported ${field.name} to file`);
                        }
                    };
                }, [fileData, fileName]);
                
                const handleSaveEdit = (offset, newBytes) => {
                    if (!fileData || offset < 0 || offset + newBytes.length > fileData.length) throw new Error('Field is outside the current file');
                    const newData = new Uint8Array(fileData);
                    newData.set(newBytes, offset);
                    setFileData(newData);
                    setHasUnsavedChanges(true);
                    setParseStatus(`>>> Field edited at 0x${offset.toString(16)}`);

                };
                
                const handleSaveFile = () => {
                    if (!fileData) return;
                    const blob = new Blob([fileData], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName.replace(/(\.[^.]+)?$/, '_modified$1');
                    a.click();
                    URL.revokeObjectURL(url);
                    setHasUnsavedChanges(false);
                    setOriginalFileData(new Uint8Array(fileData));
                    setParseStatus('>>> File saved');
                };
                
                const handleResetChanges = () => {
                    if (originalFileData) {
                        setFileData(new Uint8Array(originalFileData));
                        setHasUnsavedChanges(false);
                        setParseStatus('>>> Changes reset');

                    }
                };
                
                const loadSampleFile = () => {
                    const template = CONSTRUCT_LIBRARY.zip;
                    const sample = Uint8Array.from(template.sample.match(/../g), byte => parseInt(byte, 16));
                    setFileData(sample);
                    setOriginalFileData(sample.slice());
                    setHasUnsavedChanges(false);
                    setFileName('sample.zip');
                    setImageMimeType(null);
                    setShowImagePreview(false);
                    setStructDef(template.code);
                    setParseStatus(`>>> Sample loaded: ${sample.length} bytes`);
                };

                const toggleBuildMode = () => {
                    setIsBuildMode(!isBuildMode);
                    setParseStatus(isBuildMode ? '>>> Parse Mode' : '>>> 🔨 Build Mode');
                };
                
                // Inside BinTVApp component...
                const handleExportSVG = async () => {
                    if (!fileData || parsedFields.length === 0) {
                        alert('Please load a file and parse it first!');
                        return;
                    }
                    
                    if (typeof JSZip === 'undefined') {
                        const loadLib = confirm("This feature requires JSZip. Load it from CDN now?");
                        if (loadLib) {
                            await new Promise((resolve) => {
                                const script = document.createElement('script');
                                script.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
                                script.onload = resolve;
                                document.head.appendChild(script);
                            });
                        } else return;
                    }
                    
                    const shouldFragment = confirm("📦 Export Mode:\n\nOK = Fragment large nested structures into a ZIP\nCancel = Single SVG Overview");
                    setParseStatus('>>> Generating Export...');
                    
                    if (shouldFragment) {
                        // FIX: Pass fileName as the 3rd argument
                        await generateFragmentedZip(fileData, parsedFields, fileName);
                    } else {
                        const svgString = generateNeonSVG(fileData, parsedFields, fileName, "Master View");
                        downloadBlob(svgString, `${fileName}_neon_hud.svg`, 'image/svg+xml');
                    }
                    setParseStatus('>>> Export complete');
                };
                
                // --- RENDER ---
                
                if (isLoading) {
                    return (
                    <div className="h-screen flex items-center justify-center" style={{ background: '#0d1117' }}>
                        <div className="text-center">
                            <div className="loading-spinner mx-auto mb-4"></div>
                            <h2 className="text-2xl font-semibold" style={{ color: '#58a6ff' }}>Initializing Python Environment</h2>
                        </div>
                    </div>
                    );
                }
                
                return (
                <div className="h-screen flex flex-col" style={{ background: '#0d1117' }}>
                    {editingField && (
                        <EditModal
                        field={editingField}
                        onClose={() => setEditingField(null)}
                        onSave={handleSaveEdit}
                        />
                        )}
                        
                        <header className="terminal-border p-4" style={{ background: '#161b22' }}>
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-4">
                                    <h1 className="text-2xl font-semibold" style={{ color: '#58a6ff' }}>BinTV</h1>
                                    <span className="text-sm opacity-70">Binary Structure Viewer v1.1</span>
                                    {hasUnsavedChanges && <span className="text-sm px-2 py-1 rounded bg-yellow-600 text-black">• Modified</span>}
                                </div>
                                <div className="flex items-center space-x-2">
                                    <button onClick={loadSampleFile} disabled={isLoading} className="px-4 py-2 btn-terminal rounded">Sample</button>
                                    <input type="file" ref={fileInputRef} onChange={handleFileUpload} />
                                    <button onClick={() => fileInputRef.current?.click()} disabled={isLoading} className="px-4 py-2 btn-terminal rounded">Open File</button>
                                    <button onClick={toggleBuildMode} disabled={isLoading || isPcapFile} className="px-4 py-2 btn-terminal rounded" style={isBuildMode ? {background:'#238636'} : {}}>
                                        {isBuildMode ? '🔨 Build Mode' : '🔨 Build'}
                                    </button>
                                    {imageMimeType && (
                                        <button
                                            onClick={() => setShowImagePreview(v => !v)}
                                            className="px-4 py-2 btn-terminal rounded"
                                            style={showImagePreview ? {background:'#bc13fe'} : {}}
                                            title="Toggle image preview"
                                        >
                                            🖼️ {showImagePreview ? 'Hide Image' : 'Show Image'}
                                        </button>
                                    )}
                                    {hasUnsavedChanges && <button onClick={handleSaveFile} className="px-4 py-2 btn-terminal rounded">Save</button>}
                                    <button onClick={handleExportSVG} disabled={!fileData} className="px-4 py-2 btn-terminal rounded">Export SVG</button>
                                </div>
                            </div>
                            <div className="mt-2 text-sm flex justify-between">
                                <div>
                                    {fileName && <span className="text-blue-400">File: {fileName} ({fileData?.length} bytes)</span>}
                                    {isPcapFile && <span className="ml-4 text-green-400">PCAP Mode</span>}
                                </div>
                                <span className="opacity-70">{parseStatus}</span>
                            </div>
                            {isPcapFile && pcapPackets.length > 0 && (
                                <div className="mt-2 flex items-center space-x-2 text-sm">
                                    <button
                                        onClick={() => handlePacketChange(0)}
                                        disabled={currentPacketIndex === 0}
                                        className="px-2 py-1 btn-terminal rounded text-xs"
                                        title="First packet (g)"
                                    >⏮ First</button>
                                    <button
                                        onClick={() => handlePacketChange(currentPacketIndex - 1)}
                                        disabled={currentPacketIndex === 0}
                                        className="px-2 py-1 btn-terminal rounded text-xs"
                                        title="Previous packet (p)"
                                    >◀ Prev</button>
                                    <span className="text-green-400">
                                        Packet
                                        <input
                                            type="number"
                                            min={0}
                                            max={pcapPackets.length - 1}
                                            value={currentPacketIndex}
                                            onChange={(e) => {
                                                const v = parseInt(e.target.value, 10);
                                                if (!isNaN(v)) handlePacketChange(v);
                                            }}
                                            className="mx-2 w-16 px-1 py-0.5 bg-[#0d1117] border border-[#30363d] rounded text-center"
                                        />
                                        / {pcapPackets.length - 1}
                                    </span>
                                    <button
                                        onClick={() => handlePacketChange(currentPacketIndex + 1)}
                                        disabled={currentPacketIndex >= pcapPackets.length - 1}
                                        className="px-2 py-1 btn-terminal rounded text-xs"
                                        title="Next packet (n)"
                                    >Next ▶</button>
                                    <button
                                        onClick={() => handlePacketChange(pcapPackets.length - 1)}
                                        disabled={currentPacketIndex >= pcapPackets.length - 1}
                                        className="px-2 py-1 btn-terminal rounded text-xs"
                                        title="Last packet (G)"
                                    >Last ⏭</button>
                                    <span className="opacity-60 text-xs ml-2">
                                        ({pcapPackets[currentPacketIndex]?.data?.length || 0} bytes) — keys: n/p, g/G
                                    </span>
                                </div>
                            )}
                        </header>
                        
                        <div className="flex-1 flex overflow-hidden">
                            {/* LEFT PANEL */}
                            <div className="w-1/3 flex flex-col panel" style={{ borderRight: '1px solid #30363d' }}>
                                <div className="terminal-title flex justify-between">
                                    <span>Construct Structure</span>
                                    <button onClick={() => handleParse(false)} className="px-2 py-0.5 btn-terminal text-xs">Parse</button>
                                </div>
                                
                                <div className="p-2 bg-[#161b22] border-b border-[#30363d]">
                                    <select 
                                    className="w-full px-2 py-1 text-xs rounded bg-[#0d1117] border border-[#30363d] text-[#c9d1d9]"
                                    onChange={(e) => {
                                        const t = CONSTRUCT_LIBRARY[e.target.value];
                                        if (t) {
                                            setStructDef(t.code);
                                            // Preserve currently loaded file data; only seed sample bytes
                                            // when nothing is loaded yet, so switching templates does not
                                            // clobber the user's data being analyzed.
                                            if (t.sample && !fileData) {
                                                const hex = t.sample.replace(/[^0-9A-Fa-f]/g, '');
                                                const bytes = new Uint8Array((hex.match(/.{1,2}/g) || []).map(b => parseInt(b, 16)));
                                                setFileData(bytes);
                                                setOriginalFileData(bytes);
                                                setFileName(`${e.target.value}_sample.bin`);
                                                setHasUnsavedChanges(false);
                                                const mime = detectImageMime(bytes, `${e.target.value}_sample.bin`);
                                                setImageMimeType(mime);
                                                setShowImagePreview(!!mime);
                                                setParseStatus(`>>> Loaded template: ${t.name} (with sample)`);
                                                setTimeout(() => handleParse(true), 100);
                                            } else {
                                                setParseStatus(`>>> Loaded template: ${t.name}`);
                                            }
                                        }
                                        e.target.value = "";
                                    }}
                                    >
                                    <option value="">-- Load Template --</option>
                                    {Object.keys(CONSTRUCT_LIBRARY).map(k => (
                                        <option key={k} value={k}>{CONSTRUCT_LIBRARY[k].name}</option>
                                        ))}
                                    </select>
                                </div>
                                
                                <div className="flex-1 flex flex-col">
                                    <CodeEditor value={structDef} onChange={(e) => setStructDef(e.target.value)} placeholder="# Define Struct" />
                                    </div>
                                    
                                    {error && (
                                        <div className="m-2 error-box">
                                            <div className="font-bold text-xs">⚠️ Parse Error:</div>
                                            <pre className="text-[10px]">{error}</pre>
                                        </div>
                                        )}
                                        
                                        <div className="flex-1 overflow-y-auto border-t border-[#30363d]">
                                            {isBuildMode ? (
                                                <LiveBuilder pyodide={pyodide} structDef={structDef} initialData={fileData} onBuildComplete={(b, f) => {
                                                    setFileData(b); setParsedFields(f); setHasUnsavedChanges(true);
                                                    const flatten = (nodes, topIdx) => {
                                                        const list = [];
                                                        nodes.forEach(n => {
                                                            list.push({ offset: n.offset, length: n.length, topLevelIndex: topIdx });
                                                            if (n.children) list.push(...flatten(n.children, topIdx));
                                                        });
                                                        return list;
                                                    };
                                                    const ranges = [];
                                                    f.forEach((field, i) => ranges.push(...flatten([field], i)));
                                                    setHighlightRanges(ranges);
                                                }} />
                                                ) : (
                                                <StructureTree fields={parsedFields} onFieldSelect={handleFieldSelect} selectedField={selectedField} onFieldEdit={handleFieldEdit} onFieldHover={handleFieldHover} />
                                                )}
                                            </div>
                                        </div>
                                        
                                        {/* RIGHT PANEL (TABBED) */}
                                        <div className="flex-1 flex flex-col panel">
                                            <div className="terminal-title flex justify-between items-center pr-2">
                                                <span>{viewMode === 'hex' ? 'Hex Dump' : 'Neon HUD Preview'}</span>
                                                <div className="flex bg-[#0d1117] rounded border border-gray-700 p-0.5">
                                                    <button
                                                    className={`px-3 py-1 text-xs font-medium rounded transition-colors ${viewMode === 'hex' ? 'bg-[#238636] text-white' : 'text-gray-400'}`}
                                                    onClick={() => setViewMode('hex')}
                                                    >Hex</button>
                                                    <button
                                                    className={`px-3 py-1 text-xs font-medium rounded transition-colors ${viewMode === 'svg' ? 'bg-[#bc13fe] text-white' : 'text-gray-400'}`}
                                                    onClick={() => setViewMode('svg')}
                                                    >Neon HUD</button>
                                                </div>
                                            </div>
                                            
                                            <div className="flex-1 overflow-hidden relative" style={{ background: '#0d1117' }}>
                                                {!fileData ? (
                                                    <div className="h-full flex items-center justify-center text-gray-500">
                                                        No file loaded
                                                    </div>
                                                    ) : (
                                                    <>
                                                    <div style={{ display: viewMode === 'hex' ? 'block' : 'none', height: '100%' }}>
                                                        <HexView data={fileData} highlightRanges={highlightRanges} selectedField={selectedField} hoveredField={hoveredField} />
                                                    </div>
                                                    {viewMode === 'svg' && (
                                                    <div className="h-full w-full overflow-auto flex justify-center p-8 bg-[#050608]">
                                                        {liveSvg ? (
                                                            <div dangerouslySetInnerHTML={{ __html: liveSvg }} />
                                                            ) : (
                                                            <div className="text-[#00f3ff] mt-20">Rendering...</div>
                                                            )}
                                                        </div>
                                                        )}
                                                        </>
                                                        )}
                                                    </div>
                                                </div>

                                                {/* IMAGE PREVIEW SIDEBAR */}
                                                {imageMimeType && showImagePreview && (
                                                    <div className="w-1/4 flex flex-col panel" style={{ borderLeft: '1px solid #30363d', minWidth: '240px' }}>
                                                        <div className="terminal-title flex justify-between items-center pr-2">
                                                            <span>🖼️ Image Preview</span>
                                                            <button
                                                                onClick={() => setShowImagePreview(false)}
                                                                className="px-2 py-0.5 btn-terminal text-xs"
                                                                title="Hide preview"
                                                            >✕</button>
                                                        </div>
                                                        <div className="flex-1 overflow-auto p-2 flex items-start justify-center" style={{
                                                            background:
                                                                'repeating-conic-gradient(#1a1f26 0% 25%, #0d1117 0% 50%) 50% / 16px 16px'
                                                        }}>
                                                            {imageError ? (
                                                                <div className="text-red-400 text-xs mt-8 text-center px-2">
                                                                    ⚠️ Image failed to render.<br/>
                                                                    Bytes may be corrupted or mid-edit.
                                                                </div>
                                                            ) : imageUrl ? (
                                                                <img
                                                                    src={imageUrl}
                                                                    alt="Preview"
                                                                    onError={() => setImageError(true)}
                                                                    style={{
                                                                        maxWidth: '100%',
                                                                        height: 'auto',
                                                                        imageRendering: 'pixelated',
                                                                        boxShadow: '0 0 16px rgba(88,166,255,0.25)'
                                                                    }}
                                                                />
                                                            ) : (
                                                                <div className="text-gray-500 text-xs mt-8">Loading…</div>
                                                            )}
                                                        </div>
                                                        <div className="px-2 py-1 text-[10px] opacity-70 border-t border-[#30363d] flex justify-between">
                                                            <span>{imageMimeType}</span>
                                                            <span>{fileData?.length} bytes</span>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <footer className="terminal-border p-2 text-center" style={{ background: '#161b22', opacity: 0.7, fontSize: '12px' }}>
                                                <span>BinTV • Binary Structure Viewer • Powered by Pyodide &amp; Construct</span>
                                            </footer>
                                        </div>
                                        );
                                    };
                                    
                                    ReactDOM.render(<BinTVApp />, document.getElementById('root'));
                                    
                                    document.addEventListener('keydown', (e) => {
                                        if (e.ctrlKey && e.key === 'o') {
                                            e.preventDefault();
                                            document.querySelector('input[type="file"]')?.click();
                                        }
                                    });
                                    
                                    ReactDOM.render(<BinTVApp />, document.getElementById('root'));
                                    
                                    document.addEventListener('keydown', (e) => {
                                        if (e.ctrlKey && e.key === 'o') {
                                            e.preventDefault();
                                            document.querySelector('input[type="file"]')?.click();
                                        }
                                    });
                                </script>
                            </body>
                            </html>
